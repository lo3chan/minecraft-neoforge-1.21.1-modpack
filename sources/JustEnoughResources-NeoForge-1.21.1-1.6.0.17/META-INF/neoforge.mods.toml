# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="[4,)" #mandatory
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
license="'Don't Be a Jerk' non-commercial care-free license" #mandatory
# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/way2muchnoise/JustEnoughResources/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="jeresources" #mandatory
# The version number of the mod - there's a few well known null variables useable here or just hardcode it
version="1.6.0.17" #mandatory
 # A display name for the mod
displayName="Just Enough Resources" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/just-enough-resources-jer" #optional
# A text field displayed in the mod UI
authors="way2muchnoise" #optional
# The description text for the mod (multi line!) (#mandatory)
description='''
Adds Resources and Mob Drops to JEI
'''
[[dependencies.jeresources]]
    modId="jei"
    type="required"
    versionRange="[16.0.0,)"
    ordering="NONE"
    side="BOTH"
