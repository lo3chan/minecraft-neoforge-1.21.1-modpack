pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'minecraft-neoforge-1.21.1-modpack'

// Automatically discovers and includes all subprojects in /mods as composite builds
def modsDir = file('mods')
if (modsDir.exists() && modsDir.isDirectory()) {
    modsDir.eachDir { dir ->
        if (new File(dir, 'build.gradle').exists() || new File(dir, 'build.gradle.kts').exists()) {
            println "Discovered mod project: ${dir.name}"
            includeBuild(dir)
        }
    }
}
